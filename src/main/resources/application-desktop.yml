server:
  port: 8080

spring:
  datasource:
    # Local per-user database so the packaged app can write outside its install dir.
    url: jdbc:h2:file:${user.home}/.sgvac/sgvac;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update

sgvac:
  jwt:
    secret: "sgvac-desktop-local-only-secret-min-32-characters!!"
    expiration-ms: 86400000
  cors:
    # The Electron window serves the UI from this local origin.
    allowed-origins: http://localhost:8090
