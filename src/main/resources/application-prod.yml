server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

sgvac:
  jwt:
    secret: ${SGVAC_JWT_SECRET}
    expiration-ms: ${SGVAC_JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${SGVAC_CORS_ALLOWED_ORIGINS:http://localhost:3000}
