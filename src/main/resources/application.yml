spring:
  application:
    name: sgvac
  datasource:
    url: jdbc:h2:file:./data/sgvac;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

sgvac:
  jwt:
    secret: "sgvac-dev-secret-change-in-production-min-32-chars!!"
    expiration-ms: 86400000
  cors:
    allowed-origins: http://localhost:3000
