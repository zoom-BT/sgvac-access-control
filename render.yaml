# Render Blueprint — backend SGVAC (Spring Boot) + PostgreSQL
# Deploy: Render Dashboard → New → Blueprint → pick this repo.
# After the first deploy, set SGVAC_CORS_ALLOWED_ORIGINS to your Vercel URL.
databases:
  - name: sgvac-db
    plan: free

services:
  - type: web
    name: sgvac-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SGVAC_JWT_SECRET
        generateValue: true
      - key: SGVAC_CORS_ALLOWED_ORIGINS
        sync: false
      - key: DB_HOST
        fromDatabase:
          name: sgvac-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: sgvac-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: sgvac-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: sgvac-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: sgvac-db
          property: password
